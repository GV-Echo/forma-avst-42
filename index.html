const ITER = 150000;
const STORE = "lab0910";

const norm = s => s.trim().toUpperCase().replace(/Ё/g, "Е").replace(/[^0-9A-ZА-Я]/g, "");
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlockAny(list, answer) {
  for (const blob of list) { try { return await unlock(blob, answer); } catch (e) {} }
  throw new Error("bad key");
}

async function unlock(blob, answer) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(answer)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: bytes(blob.s), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(blob.i) }, key, bytes(blob.c));
  return JSON.parse(new TextDecoder().decode(plain));
}

function loadAnswers() { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) { return []; } }
function saveAnswers(a) { try { localStorage.setItem(STORE, JSON.stringify(a)); } catch (e) {} }

function render(payload) {
  const root = document.getElementById("stage");
  root.innerHTML = payload.html;
  if (payload.log) console.log(payload.log);
  if (payload.file) {
    const link = root.querySelector("[data-download]");
    const blob = new Blob([bytes(payload.file.data)], { type: "application/zip" });
    link.href = URL.createObjectURL(blob);
    link.download = payload.file.name;
  }
  bindForm();
  window.scrollTo(0, 0);
}

function bindForm() {
  const form = document.querySelector("form[data-blob]");
  if (!form) return;
  const err = form.parentElement.querySelector(".err");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const answer = form.querySelector("input").value;
    const idx = +form.dataset.blob;
    err.textContent = "";
    try {
      const payload = await unlockAny(BLOBS[idx], answer);
      const answers = loadAnswers(); answers[idx] = answer; saveAnswers(answers);
      render(payload);
    } catch (x) {
      err.textContent = "Неверный код.";
    }
  });
}

(async () => {
  bindForm();
  const answers = loadAnswers();
  let last = null;
  for (let i = 0; i < BLOBS.length && answers[i] != null; i++) {
    try { last = await unlockAny(BLOBS[i], answers[i]); } catch (e) { break; }
  }
  if (last) render(last);
})();
</script>
